name: Merge gate
# AUTONOMY.md gate 1: nothing reaches `main` without the full test suite green
# AND a render check. This job is that gate. It is the machine review that
# replaces David's approval, so it fails closed: any doubt is a failure.
#
# It deliberately does NOT run on the Spark. The Spark is ARM64 and these
# runners are x86_64, so a local green would not mean anything (per David,
# 2026-07-30). CI is the only place the baseline is established.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ddb_bake.py resolves the site repo AT IMPORT TIME and raises if it finds
      # none, so without this the suite cannot even be collected, let alone run.
      # Its two fallbacks (~/davidsdailybread and ~/ddb/site-mirror) are
      # Spark-era paths that no longer exist anywhere: ~/ddb was archived and
      # deleted on 2026-07-23. DDB_SITE_DIR is the module's own documented
      # override, intended for exactly this (running against a scratch copy so a
      # real bake never touches a tracked tree). Here it is the checkout.
      DDB_SITE_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history is load bearing, not a nicety. test_c3_integrity's
          # historical-repair test shells out to `git show <old-sha>:editions/...`
          # to prove past repairs were mechanical and fact preserving. The default
          # shallow clone (depth 1) does not contain those commits, so the test
          # fails with exit 128 rather than telling you the history is missing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install reader-store toolchain
        run: npm ci

      - name: Install pytest
        # The suite is stdlib-only (unittest style); pytest is just the runner.
        run: python -m pip install --quiet pytest==8.4.2

      - name: Full test suite
        # `python -m pytest` (not bare `pytest`) is load bearing: it puts the
        # repo root on sys.path so `import ddb_bake` resolves. There is no
        # conftest.py doing that for us.
        run: |
          set -euo pipefail
          python -m pytest tests/ -q 2>&1 | tee "$RUNNER_TEMP/pytest-out.txt"

      - name: Assert the suite was not silently emptied
        # pytest exits 5 on "no tests collected", which the step above would
        # already catch. This guards the subtler case: a refactor that leaves a
        # handful of tests behind and still exits 0. The floor is deliberately
        # well below the current count, so it only trips on real breakage.
        run: |
          set -euo pipefail
          passed="$(grep -oE '[0-9]+ passed' "$RUNNER_TEMP/pytest-out.txt" | head -1 | grep -oE '[0-9]+' || echo 0)"
          echo "tests passed: ${passed}"
          if [ "${passed}" -lt 15 ]; then
            echo "::error::Only ${passed} tests passed; expected at least 15. The suite looks emptied or broken."
            exit 1
          fi

      - name: Render check
        # tests/test_evening_render.py asserts at MODULE level and defines no
        # test_* functions. pytest does execute it on import, but it reports
        # "0 tests" from this file when it passes, so a future change to
        # collection could silently drop the render check. Running it directly
        # makes the check explicit and impossible to no-op.
        # It renders fixture morning + evening editions into a throwaway copy of
        # the repo and asserts each slot's write-set contract.
        run: |
          set -euo pipefail
          python3 tests/test_evening_render.py

      - name: Reader Edge source gates
        run: |
          set -euo pipefail
          npm run test:reader-edge
          npm run test:reader-types
          npm run check:reader-format
          npm run check:reader-lint
          npm audit --audit-level=high

      - name: Reader database and concurrency gates
        env:
          DDB_READER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          npm exec -- supabase start
          npm run supabase:reset
          npm run test:reader-db
          npm exec -- supabase db lint --local --schema reader_private --level error --fail-on error
          npm run test:reader-concurrency

      - name: Stop local Supabase
        if: always()
        run: npm exec -- supabase stop --no-backup

      - name: Gate result
        # Block scalar, not a plain one. A plain YAML scalar cannot contain ": ",
        # and shell quotes do not protect it: YAML is parsed before the shell
        # ever sees the line.
        run: |
          echo "Merge gate passed: full suite green and render check explicit."
