name: Daily bake
# Bakes and publishes davidsdailybread.com unattended, twice daily:
# the MORNING edition (politics-free news and Scripture: tech, markets, science)
# and the EVENING edition
# (trends: what's trending, new tools, workflows; spec: BAKE.md).
# Runs inside GitHub Actions. The untrusted author job has read-only repository
# access. A separate fresh runner validates the sealed result before minting a
# one-hour ddb-publisher GitHub App token for one atomic push.
on:
  schedule:
    # GitHub is the backup clock behind Spark's zone-aware 4:40 AM and 2:40 PM
    # Pacific triggers. Those starts target reader-ready publication near
    # 5:00 AM and 3:00 PM Pacific. Each slot has PDT and PST cron candidates;
    # cfg activates only the candidate matching the current Pacific UTC offset. This removes
    # the manual daylight-saving edit without trusting delayed execution time.
    - cron: '45 11 * * *'
    - cron: '45 12 * * *'
    - cron: '45 21 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'edition date YYYY-MM-DD, blank means today in Pacific time'
        required: false
        default: ''
      slot:
        description: 'which edition to bake'
        type: choice
        options: [morning, evening]
        required: false
        default: morning
      model:
        description: 'Claude model to bake with'
        required: false
        default: claude-opus-5
permissions:
  contents: read
concurrency:
  # Serializes writes to main so morning and evening bakes cannot race.
  group: ddb-main-publisher
  queue: max
  cancel-in-progress: false
jobs:
  prepare-reader-plan:
    outputs:
      date: ${{ steps.cfg.outputs.date }}
      slot: ${{ steps.cfg.outputs.slot }}
      mode: ${{ steps.cfg.outputs.mode }}
      already_exists: ${{ steps.existing.outputs.exists }}
      active: ${{ steps.cfg.outputs.active }}
      label: ${{ steps.cfg.outputs.label }}
      human: ${{ steps.cfg.outputs.human }}
      model: ${{ steps.cfg.outputs.model }}
      base_sha: ${{ steps.base.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout captured main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Capture immutable base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve edition date, slot and mode
        id: cfg
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_MODEL: ${{ github.event.inputs.model }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          IN="${IN_DATE:-}"
          TODAY="$(TZ=America/Los_Angeles date +%F)"
          D="${IN:-$TODAY}"
          if ! echo "$D" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid edition date '$D'; expected YYYY-MM-DD"
            exit 1
          fi
          # Scheduled runs infer the slot from which cron fired; dispatches say.
          ACTIVE=true
          if [ "${EVENT_NAME}" = "schedule" ]; then
            case "${EVENT_SCHEDULE}" in
              '45 11 * * *'|'45 12 * * *') SLOT=morning; TARGET_CLOCK=04:45:00 ;;
              '45 21 * * *'|'45 22 * * *') SLOT=evening; TARGET_CLOCK=14:45:00 ;;
              *) echo "::error::Unknown bake schedule '${EVENT_SCHEDULE}'"; exit 1 ;;
            esac
            # Gate on the nominal backup time. GitHub can start a queued run
            # after a DST boundary, when the runner's current offset differs.
            PACIFIC_OFFSET="$(TZ=America/Los_Angeles date -d "$TODAY $TARGET_CLOCK" +%z)"
            case "${PACIFIC_OFFSET}:${EVENT_SCHEDULE}" in
              '-0700:45 11 * * *'|'-0800:45 12 * * *'|'-0700:45 21 * * *'|'-0800:45 22 * * *') ;;
              *) ACTIVE=false ;;
            esac
          else
            SLOT="${IN_SLOT:-morning}"
          fi
          if [ "$SLOT" != "morning" ] && [ "$SLOT" != "evening" ]; then
            echo "::error::Invalid slot '$SLOT'"
            exit 1
          fi
          if [ "$D" = "$TODAY" ]; then MODE=daily; else MODE=backfill; fi
          if [ "$SLOT" = "morning" ]; then LABEL="Morning edition"; else LABEL="Evening edition"; fi
          HUMAN="$(TZ=UTC date -d "$D" '+%A, %B %-d, %Y')"
          MODEL="${IN_MODEL:-claude-opus-5}"
          {
            echo "date=$D"
            echo "slot=$SLOT"
            echo "label=$LABEL"
            echo "mode=$MODE"
            echo "human=$HUMAN"
            echo "model=$MODEL"
            echo "active=$ACTIVE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $D $SLOT ($MODE) with $MODEL; active=$ACTIVE"

      - name: Treat an existing edition as a successful no-op
        id: existing
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          SLOT: ${{ steps.cfg.outputs.slot }}
          ACTIVE: ${{ steps.cfg.outputs.active }}
        run: |
          set -euo pipefail
          if [ "${ACTIVE}" != "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Inactive daylight-saving backup candidate; successful no-op"
            exit 0
          fi
          if [ -f "editions/${EDITION_DATE}-${SLOT}.html" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "editions/${EDITION_DATE}-${SLOT}.html already exists on main; bake is a successful no-op"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record paused reader-plan receipt
        if: steps.existing.outputs.exists != 'true'
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          SLOT: ${{ steps.cfg.outputs.slot }}
        run: |
          set -euo pipefail
          if [ "$SLOT" = "morning" ]; then
            echo "Reader intake remains paused; the author may use reviewed house-satchel material only."
          else
            echo "No reader plan is permitted for an evening edition."
          fi
          echo "Prepared no-reader reservation receipt for ${EDITION_DATE}-${SLOT}."

  author-edition:
    needs: prepare-reader-plan
    if: needs.prepare-reader-plan.outputs.already_exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout captured base without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-reader-plan.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare DDB-reviewed evening handoff
        if: needs.prepare-reader-plan.outputs.slot == 'evening' && needs.prepare-reader-plan.outputs.mode == 'daily'
        env:
          X_MONITOR_BASE_URL: https://signal-ai-radar.fluxcognition.chatgpt.site
          X_MONITOR_SITES_BYPASS_TOKEN: ${{ secrets.X_MONITOR_SITES_BYPASS_TOKEN }}
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
        run: |
          set -euo pipefail
          python3 ddb_evening_handoff.py fetch \
            --base-url "$X_MONITOR_BASE_URL" \
            --date "$EDITION_DATE" \
            --output "$RUNNER_TEMP/ddb-reviewed-evening-handoff.json"

      - name: Install Claude Code
        run: |
          set -euo pipefail
          # Keep the verified installer outside the checkout. The bake guard
          # must see only renderer-owned output, never setup artifacts.
          package="$(npm pack @anthropic-ai/claude-code@2.1.220 --silent --pack-destination "$RUNNER_TEMP")"
          package_path="${RUNNER_TEMP}/${package}"
          echo "a2006bbf092a17d7fca249a75cac6644d1eebed1711447df7b9a5676a395de2403c6550e2a2ac5aa7c960bb3465d79c30385a491b3c7f29bd26f0c8247602ecb  ${package_path}" | sha512sum --check
          npm install -g "${package_path}"

      - name: Bake (research, write, render)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DDB_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          DDB_SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
          DDB_MODE: ${{ needs.prepare-reader-plan.outputs.mode }}
          BAKE_MODEL: ${{ needs.prepare-reader-plan.outputs.model }}
          DDB_REVIEWED_HANDOFF_PATH: ${{ runner.temp }}/ddb-reviewed-evening-handoff.json
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::No Claude credential. Add repository secret CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token'), or ANTHROPIC_API_KEY."
            exit 1
          fi
          # Unquoted heredoc delimiter lets the resolved run values and the
          # runner-local reviewed-handoff path expand into the prompt file.
          cat > "$RUNNER_TEMP/bake-prompt.txt" <<PROMPT
          You are the editor baking the $DDB_SLOT edition of davidsdailybread.com for $DDB_DATE. You are working inside a GitHub Actions runner, in a full checkout of the site repo at the current working directory, on branch main.
          Read /FOUNDER_DOCTRINE.md and /BAKE.md in this checkout and follow them exactly. BRAND.md governs reader-visible copy. BAKE.md is the complete editorial spec for both edition slots: research, content.json, render, editorial review, and (morning only) the reviewed house-satchel plan and restock.
          Notes for this run, which take precedence over BAKE.md where they differ:
          1. Setup is already done. The repo is checked out right here, so BAKE.md step 0 needs nothing from you: there is nothing to clone and no git identity to configure.
          2. Edition date: use exactly $DDB_DATE, verbatim, as --date. The runner already resolved it; no need to work it out yourself.
          3. Publishing belongs to the workflow, which commits, pushes, and verifies after you finish; BAKE.md steps 6 and 7 are its job, and git is its tool rather than yours. Your job ends when the render is clean and you have reviewed it like an editor.
          4. Slot and mode: this run bakes the $DDB_SLOT edition in $DDB_MODE mode. New reader intake and newsletter activation are paused. The daily morning bake is BAKE.md steps 1-8 as written; --plan may select only reviewed house-satchel material and must return no Ask the Baker question, reader Letter, or Crumb Board pin. The daily evening bake follows BAKE.md's section "The evening bake": its own research beat and content.json keys, rendered with --slot evening --mode $DDB_MODE, with no reader key. A backfill reconstructs an edition for the past date $DDB_DATE: use only material actually published on or before that date (dated search terms help), verify each item's publication date before using it, leave the reader sections out entirely, and render with --slot $DDB_SLOT --mode $DDB_MODE.
          5. Honesty: every fact traces to a source link you actually fetched. Work through BAKE.md step 5A, the accuracy pass, before you hand off, and say in your report what it changed. If a section cannot reach the 2-story minimum with verified stories, stop and report that plainly rather than padding; a failed bake that says so is a good outcome. In the evening edition, an item counts as trending only when a cited source shows where it is trending.
          6. Unified evening handoff: for a daily evening bake, the workflow writes DDB's reviewed packet to $DDB_REVIEWED_HANDOFF_PATH. Read it before taking any evening research action. When it has schemaVersion ddb-reviewed-evening-handoff-v1 and status ready, its selected tools and workflows are the final editorial set from the 1:40 PM combined X Manager plus DDB review. Do not discover, add, substitute, rerank, or ask X Manager for candidates. Fetch only each selected item's officialUrl and trendUrl for the final accuracy pass, then map that selected set into content.json and render it. If the file explicitly says available=false because the packet was missing, stale, invalid, or unreachable, use BAKE.md's normal source ladder as the fail-open exception; do not call X Manager or its APIs from the editorial session.
          7. If anything goes wrong, stop and explain what happened and what state the working tree is in. Fix content.json and re-render rather than adjusting rendered output by hand.
          Finish with BAKE.md step 9's report: date, slot, lead headline, story count per section, whether a reviewed house letter ran (morning only), and the render result.
          PROMPT
          if ! claude -p "$(cat "$RUNNER_TEMP/bake-prompt.txt")" \
            --model "${BAKE_MODEL}" \
            --dangerously-skip-permissions \
            > "$RUNNER_TEMP/bake-log.txt" 2>&1; then
            echo "::error::The bake session failed; raw model output is withheld from logs and artifacts."
            exit 1
          fi
          echo "Bake session completed; raw model output remains ephemeral."

      - name: Guard the changed files
        id: guard
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
          MODE: ${{ needs.prepare-reader-plan.outputs.mode }}
        run: |
          set -euo pipefail
          D="${EDITION_DATE}"
          # (a) the edition file must exist
          if [ ! -f "editions/${D}-${SLOT}.html" ]; then
            echo "::error::editions/${D}-${SLOT}.html was not produced by the bake"
            exit 1
          fi
          # (b) a reconstructed edition must never displace the current front page
          if [ "${MODE}" = "backfill" ]; then
            git checkout -- index.html tech.html markets.html science.html bakery-state.json kings-satchel.json
          fi
          # (c) every changed path and git status must match this exact run.
          # The helper is byte-pinned in this already-loaded workflow because
          # the untrusted author process can modify files in the checkout.
          echo "dce98022e1914babb56fa47ac441caa7c6743014ba0148dfb73c9a8acaabeaa1  ddb_workflow_guard.py" | sha256sum --check
          python3 ddb_workflow_guard.py --date "$D" --slot "$SLOT" \
            | tee "$RUNNER_TEMP/changed-files.txt"
          # (d) archive.json must carry this edition's entry
          python3 - "$D" "$SLOT" <<'PY'
          import json, sys
          d, slot = sys.argv[1], sys.argv[2]
          f = "editions/%s-%s.html" % (d, slot)
          a = json.load(open("archive.json"))
          ok = any(e.get("date") == d and e.get("edition") == slot and e.get("file") == f
                   for e in a.get("editions", []))
          if not ok:
              sys.stderr.write("::error::archive.json has no %s entry for %s (%s)\n" % (slot, d, f))
          sys.exit(0 if ok else 1)
          PY
          # (e) there must be something to commit
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Nothing to commit after the bake"
            exit 1
          fi

      - name: Build and seal the publisher envelope
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
          MODE: ${{ needs.prepare-reader-plan.outputs.mode }}
          BASE_SHA: ${{ needs.prepare-reader-plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          echo "cc4aa0dab58e34e2d5afbee8e44c789f9a4588cb945d1d28d5b2431b622a266b  ddb_publish_bundle.py" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/publisher-envelope"
          python3 ddb_publish_bundle.py create \
            --date "$EDITION_DATE" --slot "$SLOT" --mode "$MODE" \
            --base-sha "$BASE_SHA" \
            --output "$RUNNER_TEMP/publisher-envelope/bundle.tar.gz" \
            > "$RUNNER_TEMP/publisher-envelope/manifest-summary.json"
          openssl cms -encrypt -binary -aes-256-gcm \
            -in "$RUNNER_TEMP/publisher-envelope/bundle.tar.gz" \
            -out "$RUNNER_TEMP/publisher-envelope/bundle.cms" \
            -outform DER operations/ddb-publisher-envelope.crt
          python3 - "$RUNNER_TEMP/publisher-envelope" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          (root / "bundle.tar.gz").unlink()
          (root / "manifest-summary.json").unlink()
          envelope = root / "bundle.cms"
          if envelope.is_symlink() or not envelope.is_file() or envelope.stat().st_size > 40 * 1024 * 1024:
              raise SystemExit("sealed publisher envelope is missing or oversized")
          PY

      - name: Upload sealed publisher envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddb-publisher-envelope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-envelope/bundle.cms
          retention-days: 1
          if-no-files-found: error

      - name: Collect failure diagnostics
        if: failure()
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
          MODE: ${{ needs.prepare-reader-plan.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bake-artifacts"
          python3 - "$RUNNER_TEMP/bake-artifacts/content-summary.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          source = Path("content.json")
          summary = {
              "version": 1,
              "date": os.environ.get("EDITION_DATE") or None,
              "slot": os.environ.get("SLOT") or None,
              "mode": os.environ.get("MODE") or None,
              "contentStatus": "absent",
              "leadSection": None,
              "cardCounts": {},
              "readerSectionsPresent": [],
          }
          if source.is_file():
              try:
                  content = json.loads(source.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  summary["contentStatus"] = "invalid"
              else:
                  summary["contentStatus"] = "valid" if isinstance(content, dict) else "invalid"
                  if isinstance(content, dict):
                      allowed_sections = ("tech", "markets", "science", "tools", "workflows")
                      lead = content.get("lead")
                      if isinstance(lead, dict) and lead.get("section") in allowed_sections:
                          summary["leadSection"] = lead["section"]
                      cards = content.get("cards")
                      if isinstance(cards, dict):
                          summary["cardCounts"] = {
                              section: len(cards[section])
                              for section in allowed_sections
                              if isinstance(cards.get(section), list)
                          }
                      reader = content.get("reader")
                      if isinstance(reader, dict):
                          summary["readerSectionsPresent"] = [
                              section for section in ("ask", "king", "pin")
                              if bool(reader.get(section))
                          ]
          Path(sys.argv[1]).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bake-${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bake-artifacts/content-summary.json
          retention-days: 14
          if-no-files-found: error

  validate-and-publish:
    needs: [prepare-reader-plan, author-edition]
    if: needs.author-edition.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-publish
    permissions:
      contents: read
    outputs:
      published_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Checkout captured base without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-reader-plan.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python for publisher trust-boundary checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install publisher trust-boundary test runner
        # Install before the App key is read or decrypted output is applied.
        # The full gate uses this same reviewed pytest version.
        run: python -m pip install --quiet pytest==8.4.2

      - name: Download sealed publisher envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ddb-publisher-envelope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-envelope

      - name: Decrypt publisher envelope on the fresh runner
        env:
          DDB_PUBLISHER_PRIVATE_KEY: ${{ secrets.DDB_PUBLISHER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ddb-publisher-private-key.pem"
          cleanup_key() {
            if [ -f "$key_file" ]; then
              shred -u "$key_file"
            fi
          }
          trap cleanup_key EXIT
          printf '%s' "$DDB_PUBLISHER_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -check -noout
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/publisher-envelope/bundle.cms" \
            -inkey "$key_file" \
            -recip operations/ddb-publisher-envelope.crt \
            -out "$RUNNER_TEMP/publisher-envelope/bundle.tar.gz"

      - name: Apply and validate the exact publisher bundle without credentials
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
          MODE: ${{ needs.prepare-reader-plan.outputs.mode }}
          BASE_SHA: ${{ needs.prepare-reader-plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          echo "cc4aa0dab58e34e2d5afbee8e44c789f9a4588cb945d1d28d5b2431b622a266b  ddb_publish_bundle.py" | sha256sum --check
          echo "dce98022e1914babb56fa47ac441caa7c6743014ba0148dfb73c9a8acaabeaa1  ddb_workflow_guard.py" | sha256sum --check
          python3 ddb_publish_bundle.py apply \
            --date "$EDITION_DATE" --slot "$SLOT" --mode "$MODE" \
            --base-sha "$BASE_SHA" \
            --bundle "$RUNNER_TEMP/publisher-envelope/bundle.tar.gz" \
            > "$RUNNER_TEMP/publisher-envelope/verified-manifest.json"
          python3 ddb_workflow_guard.py --date "$EDITION_DATE" --slot "$SLOT" \
            | tee "$RUNNER_TEMP/publisher-envelope/changed-files.txt"
          python3 - "$EDITION_DATE" "$SLOT" <<'PY'
          import json, sys
          date, slot = sys.argv[1:]
          expected = f"editions/{date}-{slot}.html"
          archive = json.load(open("archive.json", encoding="utf-8"))
          if not any(
              item.get("date") == date
              and item.get("edition") == slot
              and item.get("file") == expected
              for item in archive.get("editions", [])
          ):
              raise SystemExit("archive contract does not contain the exact edition")
          PY
          git diff --check

      - name: Run publisher trust-boundary checks before loading credentials
        env:
          DDB_SITE_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m pytest \
            tests/test_workflow_guard.py \
            tests/test_publisher_bundle.py \
            tests/test_c3_integrity.py -q
          python3 tests/test_evening_render.py
          python3 ddb_workflow_guard.py \
            --date "${{ needs.prepare-reader-plan.outputs.date }}" \
            --slot "${{ needs.prepare-reader-plan.outputs.slot }}" \
            | diff -u "$RUNNER_TEMP/publisher-envelope/changed-files.txt" -
          git diff --check

      - name: Prove the captured base is still authoritative
        env:
          BASE_SHA: ${{ needs.prepare-reader-plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [ "$remote_sha" != "$BASE_SHA" ]; then
            echo "::error::Authoritative main changed to ${remote_sha:-missing}; refusing a stale publish from $BASE_SHA"
            exit 1
          fi

      - name: Mint one repository-scoped publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ vars.DDB_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.DDB_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: davidsdailybread
          permission-contents: write

      - name: Create and push one atomic publisher commit
        id: publish
        env:
          PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
          APP_SLUG: ${{ steps.publisher-token.outputs.app-slug }}
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
          MODE: ${{ needs.prepare-reader-plan.outputs.mode }}
          LABEL: ${{ needs.prepare-reader-plan.outputs.label }}
          HUMAN: ${{ needs.prepare-reader-plan.outputs.human }}
          BASE_SHA: ${{ needs.prepare-reader-plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          credential_helper='!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=$PUBLISHER_TOKEN"; fi; }; f'
          cleanup_credentials() {
            git config --local --unset-all credential.helper >/dev/null 2>&1 || true
          }
          trap cleanup_credentials EXIT
          git config --local credential.helper "$credential_helper"

          bot_id="$(GH_TOKEN="$PUBLISHER_TOKEN" gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            git add -- "$path"
          done < "$RUNNER_TEMP/publisher-envelope/changed-files.txt"
          git diff --cached --check
          if [ "$MODE" = "backfill" ]; then
            message="${LABEL} ${HUMAN} (backfill)"
          else
            message="${LABEL} ${HUMAN}"
          fi
          git -c core.hooksPath=/dev/null commit -m "$message"
          published_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [ "$remote_sha" != "$BASE_SHA" ]; then
            echo "::error::Authoritative main changed before push; refusing to rebase publisher output"
            exit 1
          fi
          git push origin HEAD:main
          echo "sha=$published_sha" >> "$GITHUB_OUTPUT"

      - name: Verify the publish
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          D="${EDITION_DATE}"
          published_sha="$PUBLISHED_SHA"
          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [ "$remote_sha" != "$published_sha" ]; then
            echo "::error::Authoritative main ref is ${remote_sha:-missing}, expected ${published_sha}"
            exit 1
          fi
          echo "Verified authoritative main ref at ${published_sha}"

          public_url="https://davidsdailybread.com/editions/${D}-${SLOT}.html"
          if python3 distribution/telegram_notification.py verify-live \
            --archive archive.json --date "$D" --slot "$SLOT" \
            --attempts 12 --delay-seconds 5; then
            echo "Verified exact public edition: ${public_url}"
          else
            echo "::warning::Authoritative main is correct, but the exact public edition is not ready yet: ${public_url}"
          fi

  x-broadcast:
    name: Canonical X broadcast
    needs: [prepare-reader-plan, author-edition, validate-and-publish]
    if: needs.validate-and-publish.result == 'success' && needs.prepare-reader-plan.outputs.active == 'true' && needs.prepare-reader-plan.outputs.mode == 'daily' && needs.prepare-reader-plan.outputs.already_exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: x-broadcast-production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout published main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare private receipt workspace
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/x-broadcast/attempts" \
            "$RUNNER_TEMP/x-broadcast/receipts" \
            "$RUNNER_TEMP/x-broadcast/reservation"

      - name: Preview exact canonical package
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py preview \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            > "$RUNNER_TEMP/x-broadcast/preview.json"
          cat "$RUNNER_TEMP/x-broadcast/preview.json"

      - name: Hydrate durable duplicate receipt
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py hydrate-github-receipt \
            --repository "$GITHUB_REPOSITORY" \
            --edition-id "${EDITION_DATE}-${SLOT}" \
            --state distribution/x-broadcast-state.json \
            --output-dir "$RUNNER_TEMP/x-broadcast/receipts"

      - name: Prepare duplicate-blocking mutation reservation
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED == 'true'
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py reserve \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts" \
            --output "$RUNNER_TEMP/x-broadcast/reservation/${EDITION_DATE}-${SLOT}.json"

      - name: Persist mutation reservation before loading X credentials
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x-broadcast-reservation-${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}
          path: ${{ runner.temp }}/x-broadcast/reservation/${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Honor default-on kill switch without loading credentials
        if: vars.DDB_X_BROADCAST_KILL_SWITCH != 'false'
        env:
          DDB_X_BROADCAST_ENABLED: ${{ vars.DDB_X_BROADCAST_ENABLED }}
          DDB_X_BROADCAST_KILL_SWITCH: 'true'
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --attempt-dir "$RUNNER_TEMP/x-broadcast/attempts" \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts"

      - name: Dry-run canonical X broadcast without loading credentials
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED != 'true'
        env:
          DDB_X_BROADCAST_ENABLED: 'false'
          DDB_X_BROADCAST_KILL_SWITCH: 'false'
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --attempt-dir "$RUNNER_TEMP/x-broadcast/attempts" \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts" \
            --dry-run

      - name: Run live canonical X broadcast
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED == 'true'
        id: x_broadcast_live
        continue-on-error: true
        env:
          DDB_X_BROADCAST_ENABLED: ${{ vars.DDB_X_BROADCAST_ENABLED }}
          DDB_X_BROADCAST_KILL_SWITCH: ${{ vars.DDB_X_BROADCAST_KILL_SWITCH }}
          X_EXPECTED_USER_ID: ${{ vars.X_EXPECTED_USER_ID }}
          X_EXPECTED_USERNAME: ${{ vars.X_EXPECTED_USERNAME }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --attempt-dir "$RUNNER_TEMP/x-broadcast/attempts" \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts"

      - name: Upload redacted broadcast attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x-broadcast-attempt-${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/x-broadcast/preview.json
            ${{ runner.temp }}/x-broadcast/attempts/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload blocking broadcast receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x-broadcast-receipt-${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}
          path: ${{ runner.temp }}/x-broadcast/receipts/${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Fail visibly after preserving broadcast evidence
        if: steps.x_broadcast_live.outcome == 'failure'
        run: |
          echo "::error::Canonical site publish succeeded, but the X broadcast failed. Review the redacted attempt and any blocking receipt before retrying."
          exit 1

  telegram-publication-receipt:
    name: Exact edition Telegram receipt
    needs: [prepare-reader-plan, author-edition, validate-and-publish]
    # A newly published edition follows validate-and-publish. A later active
    # same-edition run skips authoring but may safely recover a missing receipt.
    # `always()` lets this condition inspect the intentionally skipped jobs.
    if: >-
      always() &&
      needs.prepare-reader-plan.result == 'success' &&
      needs.prepare-reader-plan.outputs.active == 'true' &&
      needs.prepare-reader-plan.outputs.mode == 'daily' &&
      (
        needs.prepare-reader-plan.outputs.already_exists == 'true' ||
        needs.validate-and-publish.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: telegram-notification-production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout published main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare private receipt workspace
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/telegram-notification/attempts" \
            "$RUNNER_TEMP/telegram-notification/receipts" \
            "$RUNNER_TEMP/telegram-notification/reservation"

      - name: Preview exact edition package
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/telegram_notification.py preview \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            > "$RUNNER_TEMP/telegram-notification/preview.json"
          cat "$RUNNER_TEMP/telegram-notification/preview.json"

      - name: Hydrate durable duplicate receipt
        id: telegram_duplicate
        if: vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH == 'false' && vars.DDB_TELEGRAM_NOTIFY_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          result="$(python3 distribution/telegram_notification.py hydrate-github-receipt \
            --repository "$GITHUB_REPOSITORY" \
            --edition-id "${EDITION_DATE}-${SLOT}" \
            --state distribution/telegram-notification-state.json \
            --output-dir "$RUNNER_TEMP/telegram-notification/receipts")"
          if [ "$result" = "found" ]; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "A durable Telegram receipt or reservation already blocks this edition; notification is a successful no-op."
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for exact public edition URL
        if: vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH == 'false' && vars.DDB_TELEGRAM_NOTIFY_ENABLED == 'true' && steps.telegram_duplicate.outputs.duplicate != 'true'
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/telegram_notification.py verify-live \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --attempts 20 --delay-seconds 10

      - name: Prepare duplicate-blocking mutation reservation
        if: vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH == 'false' && vars.DDB_TELEGRAM_NOTIFY_ENABLED == 'true' && steps.telegram_duplicate.outputs.duplicate != 'true'
        env:
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/telegram_notification.py reserve \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/telegram-notification-state.json \
            --receipt-dir "$RUNNER_TEMP/telegram-notification/receipts" \
            --output "$RUNNER_TEMP/telegram-notification/reservation/${EDITION_DATE}-${SLOT}.json"

      - name: Persist mutation reservation before loading Telegram credentials
        if: vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH == 'false' && vars.DDB_TELEGRAM_NOTIFY_ENABLED == 'true' && steps.telegram_duplicate.outputs.duplicate != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-notification-reservation-${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}
          path: ${{ runner.temp }}/telegram-notification/reservation/${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Honor default-on kill switch without loading credentials
        if: vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH != 'false'
        env:
          DDB_TELEGRAM_NOTIFY_ENABLED: ${{ vars.DDB_TELEGRAM_NOTIFY_ENABLED }}
          DDB_TELEGRAM_NOTIFY_KILL_SWITCH: 'true'
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/telegram_notification.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/telegram-notification-state.json \
            --attempt-dir "$RUNNER_TEMP/telegram-notification/attempts" \
            --receipt-dir "$RUNNER_TEMP/telegram-notification/receipts" \
            --reservation "$RUNNER_TEMP/telegram-notification/reservation/${EDITION_DATE}-${SLOT}.json"

      - name: Dry-run exact edition notification without loading credentials
        if: vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH == 'false' && vars.DDB_TELEGRAM_NOTIFY_ENABLED != 'true'
        env:
          DDB_TELEGRAM_NOTIFY_ENABLED: 'false'
          DDB_TELEGRAM_NOTIFY_KILL_SWITCH: 'false'
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/telegram_notification.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/telegram-notification-state.json \
            --attempt-dir "$RUNNER_TEMP/telegram-notification/attempts" \
            --receipt-dir "$RUNNER_TEMP/telegram-notification/receipts" \
            --reservation "$RUNNER_TEMP/telegram-notification/reservation/${EDITION_DATE}-${SLOT}.json" \
            --dry-run

      - name: Run live exact edition notification
        id: telegram_notification_live
        if: vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH == 'false' && vars.DDB_TELEGRAM_NOTIFY_ENABLED == 'true' && steps.telegram_duplicate.outputs.duplicate != 'true'
        continue-on-error: true
        env:
          DDB_TELEGRAM_NOTIFY_ENABLED: ${{ vars.DDB_TELEGRAM_NOTIFY_ENABLED }}
          DDB_TELEGRAM_NOTIFY_KILL_SWITCH: ${{ vars.DDB_TELEGRAM_NOTIFY_KILL_SWITCH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EDITION_DATE: ${{ needs.prepare-reader-plan.outputs.date }}
          SLOT: ${{ needs.prepare-reader-plan.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/telegram_notification.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/telegram-notification-state.json \
            --attempt-dir "$RUNNER_TEMP/telegram-notification/attempts" \
            --receipt-dir "$RUNNER_TEMP/telegram-notification/receipts" \
            --reservation "$RUNNER_TEMP/telegram-notification/reservation/${EDITION_DATE}-${SLOT}.json"

      - name: Upload redacted Telegram attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-notification-attempt-${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/telegram-notification/preview.json
            ${{ runner.temp }}/telegram-notification/attempts/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload blocking Telegram receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-notification-receipt-${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}
          path: ${{ runner.temp }}/telegram-notification/receipts/${{ needs.prepare-reader-plan.outputs.date }}-${{ needs.prepare-reader-plan.outputs.slot }}.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Fail visibly after preserving notification evidence
        if: steps.telegram_notification_live.outcome == 'failure'
        run: |
          echo "::error::Canonical site publish succeeded, but the exact Telegram notification failed. Review the redacted attempt and any blocking receipt before retrying."
          exit 1
