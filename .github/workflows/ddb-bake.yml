name: Daily bake
# Bakes and publishes the morning edition of davidsdailybread.com unattended.
# Runs inside GitHub Actions so the publish can push with the built-in
# GITHUB_TOKEN; a Claude cloud session carries no repository write credential
# and dies on `git push` with HTTP 403, which is why the bake lives here.
on:
  schedule:
    # 12:05 UTC = 5:05 AM Pacific during PDT, 20 minutes after counter-sync
    # (11:45 UTC). When US daylight time ends (early November) this cron AND
    # counter-sync's cron both need a +1 hour nudge to stay at their Pacific times.
    - cron: '5 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'edition date YYYY-MM-DD, blank means today in New York'
        required: false
        default: ''
      model:
        description: 'Claude model to bake with'
        required: false
        default: claude-sonnet-5
permissions:
  contents: write
concurrency:
  group: ddb-bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # persist-credentials: false is load bearing. It strips the checkout
          # token from the local git config so the Claude bake step CANNOT push,
          # even if it tried. Only the Publish step (below) rewrites the remote
          # with GITHUB_TOKEN. Do not drop this line.
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve edition date and mode
        id: cfg
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_MODEL: ${{ github.event.inputs.model }}
        run: |
          set -euo pipefail
          IN="${IN_DATE:-}"
          TODAY="$(TZ=America/New_York date +%F)"
          D="${IN:-$TODAY}"
          if ! echo "$D" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid edition date '$D'; expected YYYY-MM-DD"
            exit 1
          fi
          if [ "$D" = "$TODAY" ]; then MODE=daily; else MODE=backfill; fi
          HUMAN="$(TZ=UTC date -d "$D" '+%A, %B %-d, %Y')"
          MODEL="${IN_MODEL:-claude-sonnet-5}"
          {
            echo "date=$D"
            echo "mode=$MODE"
            echo "human=$HUMAN"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"
          echo "Baking $D ($MODE) with $MODEL"

      - name: Refuse to double-bake
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
        run: |
          set -euo pipefail
          if [ -f "editions/${EDITION_DATE}-morning.html" ]; then
            echo "::error::editions/${EDITION_DATE}-morning.html already exists on main; refusing to double-bake"
            exit 1
          fi

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Bake (research, write, render)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DDB_DATE: ${{ steps.cfg.outputs.date }}
          DDB_MODE: ${{ steps.cfg.outputs.mode }}
          BAKE_MODEL: ${{ steps.cfg.outputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::No Claude credential. Add repository secret CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token'), or ANTHROPIC_API_KEY."
            exit 1
          fi
          # Unquoted heredoc delimiter so the two run variables ($DDB_DATE and
          # $DDB_MODE, the only variables in the prompt) expand into the file.
          cat > "$RUNNER_TEMP/bake-prompt.txt" <<PROMPT
          You are baking today's edition of davidsdailybread.com. You are running inside a GitHub Actions runner, in a full checkout of the site repo at the current working directory, on branch main.
          Read /BAKE.md in this checkout and follow it exactly. BRAND.md wins all conflicts. It is the complete editorial spec: reader plan, research, content.json, render, editorial review, satchel restock.
          Overrides for this run, which take precedence over BAKE.md where they conflict:
          1. SETUP: skip BAKE.md step 0 entirely. The repo is already checked out here. Do NOT clone anything. Do NOT configure git identity.
          2. EDITION DATE: use exactly $DDB_DATE. Do not compute the date yourself. Pass it verbatim to --date.
          3. PUBLISHING: skip BAKE.md step 6 and step 7 entirely. You have NO push credential and that is deliberate. Do NOT run git add, git commit, git push, git checkout, git reset, or any other command that writes to git. The workflow commits, pushes and verifies after you finish. Your job ends when the render is clean and you have reviewed it.
          4. MODE: this run is $DDB_MODE. daily means the normal morning bake: research news from the last 24 hours and run the reader sections per the --plan output as usual. backfill means you are reconstructing a morning edition that was never published, for the past date $DDB_DATE: research news actually published on or in the 24 hours before $DDB_DATE using dated search terms, verify each story's publication date before using it, never use a story published after $DDB_DATE, and skip the reader sections completely (do not run --plan, omit reader from content.json, and do not touch kings-satchel.json or bakery-state.json, because those days had no live reader interaction and inventing one would be dishonest).
          5. HONESTY: every fact traces to a source link you actually fetched. If a section cannot reach the 2-story minimum with verified stories, stop and report the failure rather than padding. A failed bake that says so is a good outcome; a padded one is not.
          6. If anything blocks you, stop and explain plainly what failed and what state the working tree is in. Never hand-edit rendered output to work around a validation error: fix content.json and re-render.
          Finish with BAKE.md step 9's report: date, lead headline, story count per section, which reader sections ran, and the render result.
          PROMPT
          claude -p "$(cat "$RUNNER_TEMP/bake-prompt.txt")" \
            --model "${BAKE_MODEL}" \
            --dangerously-skip-permissions \
            2>&1 | tee "$RUNNER_TEMP/bake-log.txt"

      - name: Guard the changed files
        id: guard
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          MODE: ${{ steps.cfg.outputs.mode }}
        run: |
          set -euo pipefail
          D="${EDITION_DATE}"
          # (a) the edition file must exist
          if [ ! -f "editions/${D}-morning.html" ]; then
            echo "::error::editions/${D}-morning.html was not produced by the bake"
            exit 1
          fi
          # (b) a reconstructed morning must never displace the current front page
          if [ "${MODE}" = "backfill" ]; then
            git checkout -- index.html tech.html markets.html science.html bakery-state.json kings-satchel.json
          fi
          # (c) every changed path must be on the allowlist
          git status --porcelain | cut -c4- > "$RUNNER_TEMP/changed-files.txt"
          allow='^(index\.html|tech\.html|markets\.html|science\.html|archive\.html|archive\.json|feed\.xml|bakery-state\.json|kings-satchel\.json|counter\.csv|editions/[0-9]{4}-[0-9]{2}-[0-9]{2}-(morning|evening)\.html)$'
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if ! echo "$p" | grep -qE "$allow"; then
              echo "::error::Changed path not on allowlist: $p"
              exit 1
            fi
          done < "$RUNNER_TEMP/changed-files.txt"
          # (d) archive.json must carry this morning's entry
          python3 - "$D" <<'PY'
          import json, sys
          d = sys.argv[1]
          f = "editions/%s-morning.html" % d
          a = json.load(open("archive.json"))
          ok = any(e.get("date") == d and e.get("file") == f for e in a.get("editions", []))
          if not ok:
              sys.stderr.write("::error::archive.json has no morning entry for %s (%s)\n" % (d, f))
          sys.exit(0 if ok else 1)
          PY
          # (e) there must be something to commit
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Nothing to commit after the bake"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          MODE: ${{ steps.cfg.outputs.mode }}
          HUMAN: ${{ steps.cfg.outputs.human }}
        run: |
          set -euo pipefail
          git config user.name "DDB Baker"
          git config user.email "bake@davidsdailybread.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          D="${EDITION_DATE}"
          if [ "${MODE}" = "backfill" ]; then
            git add "editions/${D}-morning.html"
            git commit -m "Morning edition ${HUMAN} (backfill)"
          else
            git add index.html tech.html markets.html science.html editions bakery-state.json kings-satchel.json
            git commit -m "Morning edition ${HUMAN}"
          fi
          git add archive.html archive.json feed.xml
          git commit -m "Archive: ${HUMAN} Morning edition"
          # counter-sync may have pushed while we baked
          git pull --rebase --no-edit origin main
          git push origin main

      - name: Verify the publish
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
        run: |
          set -euo pipefail
          D="${EDITION_DATE}"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/archive.json"
          for i in $(seq 1 10); do
            if curl -sSL --fail "$url" | grep -q "\"${D}\""; then
              echo "Verified: ${D} is live in archive.json"
              exit 0
            fi
            echo "Attempt ${i}/10: ${D} not visible yet, sleeping 20s"
            sleep 20
          done
          echo "::warning::Push succeeded but ${D} is not yet visible on raw.githubusercontent.com; this is CDN lag, not a failure."

      - name: Collect diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bake-artifacts"
          cp -f "$RUNNER_TEMP/bake-log.txt" "$RUNNER_TEMP/bake-artifacts/" 2>/dev/null || true
          cp -f content.json "$RUNNER_TEMP/bake-artifacts/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/changed-files.txt" "$RUNNER_TEMP/bake-artifacts/" 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bake-${{ steps.cfg.outputs.date }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bake-artifacts
          retention-days: 14
          if-no-files-found: ignore
