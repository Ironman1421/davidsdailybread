name: Daily bake
# Bakes and publishes davidsdailybread.com unattended, twice daily:
# the MORNING edition (news: tech, markets, science) and the EVENING edition
# (trends: what's trending, new tools, workflows; spec: BAKE.md).
# Runs inside GitHub Actions so the publish can push with the built-in
# GITHUB_TOKEN; a Claude cloud session carries no repository write credential
# and dies on `git push` with HTTP 403, which is why the bake lives here.
on:
  schedule:
    # Morning: 12:05 UTC = 5:05 AM Pacific during PDT, 20 minutes after
    # counter-sync (11:45 UTC). Evening: 22:35 UTC = 3:35 PM Pacific during PDT.
    # GitHub cron fires LATE, not never (observed lag up to ~2-3h); treat these
    # as "no earlier than". When US daylight time ends (early November) BOTH
    # bake crons AND counter-sync's cron need a +1 hour nudge to stay at their
    # Pacific times. The slot is resolved from which cron fired (see cfg step).
    - cron: '5 12 * * *'
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'edition date YYYY-MM-DD, blank means today in New York'
        required: false
        default: ''
      slot:
        description: 'which edition to bake'
        type: choice
        options: [morning, evening]
        required: false
        default: morning
      model:
        description: 'Claude model to bake with'
        required: false
        default: claude-opus-5
permissions:
  contents: write
concurrency:
  # Serializes every workflow that can write main. Keep this group in sync
  # with counter-sync.yml so a late Counter refresh cannot race a bake push.
  group: ddb-main-writers
  queue: max
  cancel-in-progress: false
jobs:
  bake:
    outputs:
      date: ${{ steps.cfg.outputs.date }}
      slot: ${{ steps.cfg.outputs.slot }}
      mode: ${{ steps.cfg.outputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # persist-credentials: false is load bearing. It strips the checkout
          # token from the local git config so the Claude bake step CANNOT push,
          # even if it tried. Only the Publish step (below) rewrites the remote
          # with GITHUB_TOKEN. Do not drop this line.
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve edition date, slot and mode
        id: cfg
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_MODEL: ${{ github.event.inputs.model }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          IN="${IN_DATE:-}"
          TODAY="$(TZ=America/New_York date +%F)"
          D="${IN:-$TODAY}"
          if ! echo "$D" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid edition date '$D'; expected YYYY-MM-DD"
            exit 1
          fi
          # Scheduled runs infer the slot from which cron fired; dispatches say.
          if [ "${EVENT_NAME}" = "schedule" ]; then
            if [ "${EVENT_SCHEDULE}" = "5 12 * * *" ]; then SLOT=morning; else SLOT=evening; fi
          else
            SLOT="${IN_SLOT:-morning}"
          fi
          if [ "$SLOT" != "morning" ] && [ "$SLOT" != "evening" ]; then
            echo "::error::Invalid slot '$SLOT'"
            exit 1
          fi
          if [ "$D" = "$TODAY" ]; then MODE=daily; else MODE=backfill; fi
          if [ "$SLOT" = "morning" ]; then LABEL="Morning edition"; else LABEL="Evening edition"; fi
          HUMAN="$(TZ=UTC date -d "$D" '+%A, %B %-d, %Y')"
          MODEL="${IN_MODEL:-claude-opus-5}"
          {
            echo "date=$D"
            echo "slot=$SLOT"
            echo "label=$LABEL"
            echo "mode=$MODE"
            echo "human=$HUMAN"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"
          echo "Baking $D $SLOT ($MODE) with $MODEL"

      - name: Refuse to double-bake
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          SLOT: ${{ steps.cfg.outputs.slot }}
        run: |
          set -euo pipefail
          if [ -f "editions/${EDITION_DATE}-${SLOT}.html" ]; then
            echo "::error::editions/${EDITION_DATE}-${SLOT}.html already exists on main; refusing to double-bake"
            exit 1
          fi

      - name: Install Claude Code
        run: |
          set -euo pipefail
          # Keep the verified installer outside the checkout. The bake guard
          # must see only renderer-owned output, never setup artifacts.
          package="$(npm pack @anthropic-ai/claude-code@2.1.220 --silent --pack-destination "$RUNNER_TEMP")"
          package_path="${RUNNER_TEMP}/${package}"
          echo "a2006bbf092a17d7fca249a75cac6644d1eebed1711447df7b9a5676a395de2403c6550e2a2ac5aa7c960bb3465d79c30385a491b3c7f29bd26f0c8247602ecb  ${package_path}" | sha512sum --check
          npm install -g "${package_path}"

      - name: Bake (research, write, render)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DDB_DATE: ${{ steps.cfg.outputs.date }}
          DDB_SLOT: ${{ steps.cfg.outputs.slot }}
          DDB_MODE: ${{ steps.cfg.outputs.mode }}
          BAKE_MODEL: ${{ steps.cfg.outputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::No Claude credential. Add repository secret CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token'), or ANTHROPIC_API_KEY."
            exit 1
          fi
          # Unquoted heredoc delimiter so the three run variables ($DDB_DATE,
          # $DDB_SLOT and $DDB_MODE, the only variables in the prompt) expand into the file.
          cat > "$RUNNER_TEMP/bake-prompt.txt" <<PROMPT
          You are the editor baking the $DDB_SLOT edition of davidsdailybread.com for $DDB_DATE. You are working inside a GitHub Actions runner, in a full checkout of the site repo at the current working directory, on branch main.
          Read /BAKE.md in this checkout and follow it exactly. BRAND.md wins all conflicts. BAKE.md is the complete editorial spec for both edition slots: research, content.json, render, editorial review, and (morning only) the reader plan and satchel restock.
          Notes for this run, which take precedence over BAKE.md where they differ:
          1. Setup is already done. The repo is checked out right here, so BAKE.md step 0 needs nothing from you: there is nothing to clone and no git identity to configure.
          2. Edition date: use exactly $DDB_DATE, verbatim, as --date. The runner already resolved it; no need to work it out yourself.
          3. Publishing belongs to the workflow, which commits, pushes, and verifies after you finish; BAKE.md steps 6 and 7 are its job, and git is its tool rather than yours. Your job ends when the render is clean and you have reviewed it like an editor.
          4. Slot and mode: this run bakes the $DDB_SLOT edition in $DDB_MODE mode. The daily morning bake is BAKE.md steps 1-8 as written, reader sections per the --plan output. The daily evening bake follows BAKE.md's section "The evening bake": its own research beat and its own content.json keys, rendered with --slot evening --mode $DDB_MODE; the reader plan and reader sections belong to the morning paper only. A backfill reconstructs an edition for the past date $DDB_DATE: use only material actually published on or before that date (dated search terms help), verify each item's publication date before using it, leave the reader sections out entirely, and render with --slot $DDB_SLOT --mode $DDB_MODE.
          5. Honesty: every fact traces to a source link you actually fetched. Work through BAKE.md step 5A, the accuracy pass, before you hand off, and say in your report what it changed. If a section cannot reach the 2-story minimum with verified stories, stop and report that plainly rather than padding; a failed bake that says so is a good outcome. In the evening edition, an item counts as trending only when a cited source shows where it is trending.
          6. If anything goes wrong, stop and explain what happened and what state the working tree is in. Fix content.json and re-render rather than adjusting rendered output by hand.
          Finish with BAKE.md step 9's report: date, slot, lead headline, story count per section, which reader sections ran (morning only), and the render result.
          PROMPT
          claude -p "$(cat "$RUNNER_TEMP/bake-prompt.txt")" \
            --model "${BAKE_MODEL}" \
            --dangerously-skip-permissions \
            2>&1 | tee "$RUNNER_TEMP/bake-log.txt"

      - name: Guard the changed files
        id: guard
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          SLOT: ${{ steps.cfg.outputs.slot }}
          MODE: ${{ steps.cfg.outputs.mode }}
        run: |
          set -euo pipefail
          D="${EDITION_DATE}"
          # (a) the edition file must exist
          if [ ! -f "editions/${D}-${SLOT}.html" ]; then
            echo "::error::editions/${D}-${SLOT}.html was not produced by the bake"
            exit 1
          fi
          # (b) a reconstructed edition must never displace the current front page
          if [ "${MODE}" = "backfill" ]; then
            git checkout -- index.html tech.html markets.html science.html bakery-state.json kings-satchel.json
          fi
          # (c) every changed path and git status must match this exact run.
          # The helper is byte-pinned in this already-loaded workflow because
          # the untrusted author process can modify files in the checkout.
          echo "cdb05086f9e8fa242098298e2502406f064311a07eb5d76b47324af6bacbfbb4  ddb_workflow_guard.py" | sha256sum --check
          python3 ddb_workflow_guard.py --date "$D" --slot "$SLOT" \
            | tee "$RUNNER_TEMP/changed-files.txt"
          # (d) archive.json must carry this edition's entry
          python3 - "$D" "$SLOT" <<'PY'
          import json, sys
          d, slot = sys.argv[1], sys.argv[2]
          f = "editions/%s-%s.html" % (d, slot)
          a = json.load(open("archive.json"))
          ok = any(e.get("date") == d and e.get("edition") == slot and e.get("file") == f
                   for e in a.get("editions", []))
          if not ok:
              sys.stderr.write("::error::archive.json has no %s entry for %s (%s)\n" % (slot, d, f))
          sys.exit(0 if ok else 1)
          PY
          # (e) there must be something to commit
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Nothing to commit after the bake"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          SLOT: ${{ steps.cfg.outputs.slot }}
          LABEL: ${{ steps.cfg.outputs.label }}
          MODE: ${{ steps.cfg.outputs.mode }}
          HUMAN: ${{ steps.cfg.outputs.human }}
        run: |
          set -euo pipefail
          git config user.name "DDB Baker"
          git config user.email "bake@davidsdailybread.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          D="${EDITION_DATE}"
          EXPECTED_EDITION="editions/${D}-${SLOT}.html"
          if [ "${MODE}" = "backfill" ]; then
            git add "$EXPECTED_EDITION"
            git -c core.hooksPath=/dev/null commit -m "${LABEL} ${HUMAN} (backfill)"
          elif [ "${SLOT}" = "morning" ]; then
            git add index.html tech.html markets.html science.html "$EXPECTED_EDITION" bakery-state.json kings-satchel.json
            git -c core.hooksPath=/dev/null commit -m "${LABEL} ${HUMAN}"
          else
            git add index.html evening-catalog.json "$EXPECTED_EDITION"
            git -c core.hooksPath=/dev/null commit -m "${LABEL} ${HUMAN}"
          fi
          git add archive.html archive.json feed.xml
          git -c core.hooksPath=/dev/null commit -m "Archive: ${HUMAN} ${LABEL}"
          # counter-sync may have pushed while we baked
          git -c core.hooksPath=/dev/null pull --rebase --no-edit origin main
          git -c core.hooksPath=/dev/null push origin main

      - name: Verify the publish
        env:
          EDITION_DATE: ${{ steps.cfg.outputs.date }}
          SLOT: ${{ steps.cfg.outputs.slot }}
        run: |
          set -euo pipefail
          D="${EDITION_DATE}"
          # Grep for the slot's edition file, not just the date: on an evening
          # bake the date alone would already match the morning entry.
          needle="editions/${D}-${SLOT}.html"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/archive.json"
          for i in $(seq 1 10); do
            if curl -sSL --fail "$url" | grep -qF "\"${needle}\""; then
              echo "Verified: ${needle} is live in archive.json"
              exit 0
            fi
            echo "Attempt ${i}/10: ${needle} not visible yet, sleeping 20s"
            sleep 20
          done
          echo "::warning::Push succeeded but ${needle} is not yet visible on raw.githubusercontent.com; this is CDN lag, not a failure."

      - name: Collect diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bake-artifacts"
          cp -f "$RUNNER_TEMP/bake-log.txt" "$RUNNER_TEMP/bake-artifacts/" 2>/dev/null || true
          cp -f content.json "$RUNNER_TEMP/bake-artifacts/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/changed-files.txt" "$RUNNER_TEMP/bake-artifacts/" 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bake-${{ steps.cfg.outputs.date }}-${{ steps.cfg.outputs.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bake-artifacts
          retention-days: 14
          if-no-files-found: ignore

  x-broadcast:
    name: Canonical X broadcast
    needs: bake
    if: needs.bake.result == 'success' && needs.bake.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: x-broadcast-production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout published main without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Prepare private receipt workspace
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/x-broadcast/attempts" \
            "$RUNNER_TEMP/x-broadcast/receipts" \
            "$RUNNER_TEMP/x-broadcast/reservation"

      - name: Preview exact canonical package
        env:
          EDITION_DATE: ${{ needs.bake.outputs.date }}
          SLOT: ${{ needs.bake.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py preview \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            > "$RUNNER_TEMP/x-broadcast/preview.json"
          cat "$RUNNER_TEMP/x-broadcast/preview.json"

      - name: Hydrate durable duplicate receipt
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ needs.bake.outputs.date }}
          SLOT: ${{ needs.bake.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py hydrate-github-receipt \
            --repository "$GITHUB_REPOSITORY" \
            --edition-id "${EDITION_DATE}-${SLOT}" \
            --state distribution/x-broadcast-state.json \
            --output-dir "$RUNNER_TEMP/x-broadcast/receipts"

      - name: Prepare duplicate-blocking mutation reservation
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED == 'true'
        env:
          EDITION_DATE: ${{ needs.bake.outputs.date }}
          SLOT: ${{ needs.bake.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py reserve \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts" \
            --output "$RUNNER_TEMP/x-broadcast/reservation/${EDITION_DATE}-${SLOT}.json"

      - name: Persist mutation reservation before loading X credentials
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x-broadcast-reservation-${{ needs.bake.outputs.date }}-${{ needs.bake.outputs.slot }}
          path: ${{ runner.temp }}/x-broadcast/reservation/${{ needs.bake.outputs.date }}-${{ needs.bake.outputs.slot }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Honor default-on kill switch without loading credentials
        if: vars.DDB_X_BROADCAST_KILL_SWITCH != 'false'
        env:
          DDB_X_BROADCAST_ENABLED: ${{ vars.DDB_X_BROADCAST_ENABLED }}
          DDB_X_BROADCAST_KILL_SWITCH: 'true'
          EDITION_DATE: ${{ needs.bake.outputs.date }}
          SLOT: ${{ needs.bake.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --attempt-dir "$RUNNER_TEMP/x-broadcast/attempts" \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts"

      - name: Dry-run canonical X broadcast without loading credentials
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED != 'true'
        env:
          DDB_X_BROADCAST_ENABLED: 'false'
          DDB_X_BROADCAST_KILL_SWITCH: 'false'
          EDITION_DATE: ${{ needs.bake.outputs.date }}
          SLOT: ${{ needs.bake.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --attempt-dir "$RUNNER_TEMP/x-broadcast/attempts" \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts" \
            --dry-run

      - name: Run live canonical X broadcast
        if: vars.DDB_X_BROADCAST_KILL_SWITCH == 'false' && vars.DDB_X_BROADCAST_ENABLED == 'true'
        id: x_broadcast_live
        continue-on-error: true
        env:
          DDB_X_BROADCAST_ENABLED: ${{ vars.DDB_X_BROADCAST_ENABLED }}
          DDB_X_BROADCAST_KILL_SWITCH: ${{ vars.DDB_X_BROADCAST_KILL_SWITCH }}
          X_EXPECTED_USER_ID: ${{ vars.X_EXPECTED_USER_ID }}
          X_EXPECTED_USERNAME: ${{ vars.X_EXPECTED_USERNAME }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          EDITION_DATE: ${{ needs.bake.outputs.date }}
          SLOT: ${{ needs.bake.outputs.slot }}
        run: |
          set -euo pipefail
          python3 distribution/x_broadcast.py run \
            --archive archive.json --date "$EDITION_DATE" --slot "$SLOT" \
            --state distribution/x-broadcast-state.json \
            --attempt-dir "$RUNNER_TEMP/x-broadcast/attempts" \
            --receipt-dir "$RUNNER_TEMP/x-broadcast/receipts"

      - name: Upload redacted broadcast attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x-broadcast-attempt-${{ needs.bake.outputs.date }}-${{ needs.bake.outputs.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/x-broadcast/preview.json
            ${{ runner.temp }}/x-broadcast/attempts/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload blocking broadcast receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x-broadcast-receipt-${{ needs.bake.outputs.date }}-${{ needs.bake.outputs.slot }}
          path: ${{ runner.temp }}/x-broadcast/receipts/${{ needs.bake.outputs.date }}-${{ needs.bake.outputs.slot }}.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Fail visibly after preserving broadcast evidence
        if: steps.x_broadcast_live.outcome == 'failure'
        run: |
          echo "::error::Canonical site publish succeeded, but the X broadcast failed. Review the redacted attempt and any blocking receipt before retrying."
          exit 1
