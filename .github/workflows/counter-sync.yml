name: Counter sync (paused)
# New reader intake is paused by the founder until its private boundary is
# verified. This retained workflow is a visible no-op and has no schedule,
# network access, checkout, write permission, artifact, or repository mutation.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the reader-intake pause
        run: |
          echo "Counter sync is paused. No reader data was fetched or written."
